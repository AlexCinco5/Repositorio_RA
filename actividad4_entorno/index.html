<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 4 - Supervivencia AR</title>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        
        /* Video real de la cámara de tu celular como fondo */
        #camara-fondo {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover; z-index: 0;
        }

        /* Hacemos transparente el entorno 3D para que veas el cuarto */
        .a-canvas { background-color: transparent !important; z-index: 1 !important; }

        #ui-capa { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; font-family: sans-serif; }
        #hud { display: flex; justify-content: space-between; padding: 20px; font-size: 24px; font-weight: bold; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        .vida { color: #ef4444; } .puntos { color: #3b82f6; }
        
        #btn-iniciar { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 20px 40px; font-size: 20px; font-weight: bold; background-color: #3b82f6; color: white; border: none; border-radius: 10px; pointer-events: auto; z-index: 20; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        #btn-disparar { position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%); padding: 20px 40px; font-size: 24px; font-weight: bold; background-color: #f97316; color: white; border: none; border-radius: 50px; pointer-events: auto; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        #btn-disparar:active { background-color: #ea580c; transform: translateX(-50%) scale(0.95); }
        
        #pantalla-muerte { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); display: none; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; color: white; text-align: center; }
        #btn-reiniciar { margin-top: 20px; padding: 15px 30px; font-size: 20px; background-color: #22c55e; color: white; border: none; border-radius: 10px; cursor: pointer; }
    </style>

    <script>
        // Función universal para encender la cámara trasera
        async function iniciarJuego() {
            document.getElementById('btn-iniciar').style.display = 'none';
            document.getElementById('btn-disparar').style.display = 'block';
            
            const video = document.getElementById('camara-fondo');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
            } catch(err) { alert("Acepta los permisos de cámara para jugar."); }

            document.querySelector('a-scene').components['game-manager'].iniciarOleadas();
        }

        let score = 0; let lives = 3; let isGameOver = false;

        AFRAME.registerComponent('game-manager', {
            init: function() {
                document.getElementById('btn-disparar').addEventListener('click', () => {
                    if (isGameOver) return;
                    
                    const raycaster = document.getElementById('visor').components.raycaster;
                    const intersectedEls = raycaster.intersectedEls;
                    
                    if (intersectedEls.length > 0) {
                        let zombie = intersectedEls[0];
                        if(zombie.classList.contains('zombie')) {
                            zombie.parentNode.removeChild(zombie);
                            score += 10;
                            document.getElementById('puntos').innerText = "Puntos: " + score;
                            setTimeout(() => { this.spawnZombie(); }, 1000);
                        }
                    }
                });

                document.getElementById('btn-reiniciar').addEventListener('click', () => {
                    score = 0; lives = 3; isGameOver = false;
                    document.getElementById('puntos').innerText = "Puntos: " + score;
                    document.getElementById('vida').innerText = "Vidas: " + lives;
                    document.getElementById('pantalla-muerte').style.display = 'none';
                    document.getElementById('btn-disparar').style.display = 'block';
                    document.querySelectorAll('.zombie').forEach(z => z.parentNode.removeChild(z));
                    this.spawnZombie();
                });
            },
            iniciarOleadas: function() { this.spawnZombie(); },
            spawnZombie: function() {
                if(isGameOver) return;
                
                let scene = this.el;
                let zombie = document.createElement('a-entity');
                zombie.setAttribute('class', 'zombie');
                zombie.setAttribute('zombie-ai', '');
                zombie.setAttribute('gltf-model', '#modelo-zombie');
                zombie.setAttribute('scale', '1 1 1'); // Ajusta esto si tu zombie.glb es muy grande
                
                let angulo = Math.random() * Math.PI * 2;
                let radio = 10; // Aparecen a 10 metros de distancia
                let x = Math.cos(angulo) * radio;
                let z = Math.sin(angulo) * radio;
                
                zombie.setAttribute('position', `${x} -1.5 ${z}`);
                scene.appendChild(zombie);
            },
            takeDamage: function() {
                if(isGameOver) return;
                lives--;
                document.getElementById('vida').innerText = "Vidas: " + lives;
                
                if(lives <= 0) {
                    isGameOver = true;
                    document.getElementById('score-final').innerText = score;
                    document.getElementById('pantalla-muerte').style.display = 'flex';
                    document.getElementById('btn-disparar').style.display = 'none';
                } else {
                    setTimeout(() => { this.spawnZombie(); }, 1000);
                }
            }
        });

        AFRAME.registerComponent('zombie-ai', {
            schema: { speed: {type: 'number', default: 0.05} },
            tick: function() {
                if(isGameOver) return;
                let pos = this.el.object3D.position;
                let camPos = document.querySelector('a-camera').object3D.position;
                
                let dx = camPos.x - pos.x; let dz = camPos.z - pos.z;
                let distance = Math.sqrt(dx*dx + dz*dz);
                
                if(distance < 1.5) {
                    this.el.sceneEl.components['game-manager'].takeDamage();
                    this.el.parentNode.removeChild(this.el);
                } else {
                    pos.x += (dx / distance) * this.data.speed;
                    pos.z += (dz / distance) * this.data.speed;
                    this.el.object3D.lookAt(camPos.x, pos.y, camPos.z);
                }
            }
        });
    </script>
</head>
<body>

    <!-- Foco de cámara real 100% garantizado en móviles -->
    <video id="camara-fondo" autoplay playsinline muted></video>

    <div id="ui-capa">
        <button id="btn-iniciar" onclick="iniciarJuego()">▶ INICIAR JUEGO</button>
        
        <div id="hud">
            <div id="puntos" class="puntos">Puntos: 0</div>
            <div id="vida" class="vida">Vidas: 3</div>
        </div>
        
        <button id="btn-disparar">🎯 DISPARAR</button>

        <div id="pantalla-muerte">
            <h1 style="color: #ef4444; font-size: 40px; margin-bottom: 0;">¡ESTÁS MUERTO!</h1>
            <h2 style="margin-top: 10px;">Puntos finales: <span id="score-final">0</span></h2>
            <button id="btn-reiniciar">Jugar de Nuevo</button>
        </div>
    </div>

    <!-- Escena transparente apoyada por los giroscopios (Sin WebXR) -->
    <a-scene vr-mode-ui="enabled: false" game-manager>
        <a-assets>
            <a-asset-item id="modelo-zombie" src="zombie.glb"></a-asset-item>
        </a-assets>

        <!-- La cámara seguirá los giros de tu celular automáticamente -->
        <a-camera look-controls="touchEnabled: false; pointerLockEnabled: false">
            <a-entity id="visor" 
                      raycaster="objects: .zombie; far: 20" 
                      cursor="fuse: false; rayOrigin: entity;" 
                      geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03" 
                      material="color: red; shader: flat" 
                      position="0 0 -1">
            </a-entity>
        </a-camera>
    </a-scene>

</body>
</html>
