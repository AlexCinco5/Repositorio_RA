<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 4 - Supervivencia AR</title>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <style>
        /* Capa de Interfaz Gráfica sobre la cámara (DOM Overlay) */
        #ui-capa {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none; font-family: sans-serif;
        }

        /* Contadores superiores */
        #hud {
            display: flex; justify-content: space-between; padding: 20px;
            font-size: 24px; font-weight: bold; color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .vida { color: #ef4444; }
        .puntos { color: #3b82f6; }

        /* Botón de disparar */
        #btn-disparar {
            position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%);
            padding: 20px 40px; font-size: 24px; font-weight: bold;
            background-color: #f97316; color: white; border: none;
            border-radius: 50px; box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            pointer-events: auto;
        }
        #btn-disparar:active { background-color: #ea580c; transform: translateX(-50%) scale(0.95); }

        /* Pantalla de Fin de Juego */
        #pantalla-muerte {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85); display: none;
            flex-direction: column; justify-content: center; align-items: center;
            pointer-events: auto; color: white; text-align: center;
        }
        #btn-reiniciar {
            margin-top: 20px; padding: 15px 30px; font-size: 20px;
            background-color: #22c55e; color: white; border: none;
            border-radius: 10px; cursor: pointer;
        }
    </style>

    <script>
        let score = 0;
        let lives = 3;
        let isGameOver = false;

        AFRAME.registerComponent('game-manager', {
            init: function() {
                this.spawnZombie();
                
                document.getElementById('btn-disparar').addEventListener('click', () => {
                    if (isGameOver) return;
                    
                    const raycasterEl = document.getElementById('visor');
                    const raycaster = raycasterEl.components.raycaster;
                    const intersectedEls = raycaster.intersectedEls;
                    
                    if (intersectedEls.length > 0) {
                        let zombie = intersectedEls[0];
                        // Validar que realmente tocamos a un enemigo y no al piso
                        if(zombie.classList.contains('zombie')) {
                            zombie.parentNode.removeChild(zombie);
                            
                            score += 10;
                            document.getElementById('puntos').innerText = "Puntos: " + score;
                            
                            setTimeout(() => { this.spawnZombie(); }, 1000);
                        }
                    }
                });

                document.getElementById('btn-reiniciar').addEventListener('click', () => {
                    score = 0;
                    lives = 3;
                    isGameOver = false;
                    document.getElementById('puntos').innerText = "Puntos: " + score;
                    document.getElementById('vida').innerText = "Vidas: " + lives;
                    document.getElementById('pantalla-muerte').style.display = 'none';
                    document.getElementById('btn-disparar').style.display = 'block';
                    
                    // Limpiar zombis restantes
                    document.querySelectorAll('.zombie').forEach(z => z.parentNode.removeChild(z));
                    
                    this.spawnZombie();
                });
            },

            spawnZombie: function() {
                if(isGameOver) return;
                
                let scene = this.el;
                let zombie = document.createElement('a-entity');
                
                zombie.setAttribute('class', 'zombie');
                zombie.setAttribute('zombie-ai', '');
                
                // Carga el modelo tridimensional del zombi en lugar de la caja verde
                zombie.setAttribute('gltf-model', '#modelo-zombie');
                
                // NOTA: Si el modelo del zombi es gigante o microscópico, ajusta los valores de scale aquí (ej. '0.5 0.5 0.5' o '5 5 5')
                zombie.setAttribute('scale', '1 1 1'); 
                
                let angulo = Math.random() * Math.PI * 2;
                let radio = 15;
                let x = Math.cos(angulo) * radio;
                let z = Math.sin(angulo) * radio;
                
                zombie.setAttribute('position', `${x} 0 ${z}`);
                
                scene.appendChild(zombie);
            },

            takeDamage: function() {
                if(isGameOver) return;
                lives--;
                document.getElementById('vida').innerText = "Vidas: " + lives;
                
                if(lives <= 0) {
                    isGameOver = true;
                    document.getElementById('score-final').innerText = score;
                    document.getElementById('pantalla-muerte').style.display = 'flex';
                    document.getElementById('btn-disparar').style.display = 'none';
                } else {
                    setTimeout(() => { this.spawnZombie(); }, 1000);
                }
            }
        });

        AFRAME.registerComponent('zombie-ai', {
            schema: { speed: {type: 'number', default: 0.02} },
            
            tick: function() {
                if(isGameOver) return;
                
                let pos = this.el.object3D.position;
                let camPos = document.querySelector('a-camera').object3D.position;
                
                let dx = camPos.x - pos.x;
                let dz = camPos.z - pos.z;
                let distance = Math.sqrt(dx*dx + dz*dz);
                
                if(distance < 1.5) {
                    this.el.sceneEl.components['game-manager'].takeDamage();
                    this.el.parentNode.removeChild(this.el);
                } else {
                    pos.x += (dx / distance) * this.data.speed;
                    pos.z += (dz / distance) * this.data.speed;
                    
                    this.el.object3D.lookAt(camPos.x, pos.y, camPos.z);
                }
            }
        });
    </script>
</head>
<body style="margin: 0; overflow: hidden;">

    <div id="ui-capa">
        <div id="hud">
            <div id="puntos" class="puntos">Puntos: 0</div>
            <div id="vida" class="vida">Vidas: 3</div>
        </div>
        
        <button id="btn-disparar">🎯 DISPARAR</button>

        <div id="pantalla-muerte">
            <h1 style="color: #ef4444; font-size: 40px; margin-bottom: 0;">¡ESTÁS MUERTO!</h1>
            <h2 style="margin-top: 10px;">Puntos finales: <span id="score-final">0</span></h2>
            <button id="btn-reiniciar">Jugar de Nuevo</button>
        </div>
    </div>

    <a-scene webxr="optionalFeatures: dom-overlay; overlayElement: #ui-capa;" game-manager>
        
        <!-- Precargamos el modelo 3D para evitar tirones de rendimiento en el celular -->
        <a-assets>
            <a-asset-item id="modelo-zombie" src="zombie.glb"></a-asset-item>
        </a-assets>

        <a-camera>
            <a-entity id="visor" 
                      raycaster="objects: .zombie; far: 20" 
                      cursor="fuse: false; rayOrigin: entity;" 
                      geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03" 
                      material="color: red; shader: flat" 
                      position="0 0 -1">
            </a-entity>
        </a-camera>

        <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" material="transparent: true; opacity: 0;"></a-plane>

    </a-scene>

</body>
</html>
