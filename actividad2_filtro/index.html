<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>Filtro RA - Máscara de Gas (Boca Reactiva)</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            touch-action: none;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        a-scene {
            position: fixed !important;
            top: 0; left: 0;
            width: 100% !important;
            height: 100% !important;
        }

        .a-enter-vr, .a-enter-ar, .a-orientation-modal, .a-loader-title {
            display: none !important;
        }

        #instruccion {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            background: #000;
            color: #fff;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 16px;
        }

        #instruccion.oculto { display: none; }

        #instruccion button {
            margin-top: 24px;
            padding: 16px 36px;
            font-size: 18px;
            font-weight: 600;
            border: 0;
            border-radius: 40px;
            background: #ff3b30;
            color: #fff;
            -webkit-appearance: none;
            appearance: none;
            touch-action: manipulation;
        }
    </style>
</head>
<body>

    <div id="instruccion">
        <p>Permite el acceso a la cámara y toca el botón para comenzar.</p>
        <button id="btn-iniciar" type="button">INICIAR</button>
    </div>

    <a-scene
        mindar-face="autoStart: false; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 5; warmupTolerance: 3"
        renderer="antialias: false; precision: mediump; alpha: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        loading-screen="enabled: false"
        embedded>

        <!-- ===================================================== -->
        <!--  TU ESCENA: reemplaza este bloque por tu contenido    -->
        <!--  original (a-assets, a-camera, entidades, etc.)      -->
        <!--  Este es solo un ejemplo funcional de prueba.         -->
        <!-- ===================================================== -->

        <a-assets>
            <!-- Pon aquí tus modelos, texturas y audios -->
        </a-assets>

        <a-camera
            position="0 0 0"
            look-controls="enabled: false"
            wasd-controls="enabled: false"
            fov="60">
        </a-camera>

        <a-entity mindar-face-target="anchorIndex: 168">
            <!-- anchorIndex 168 = punta de la nariz aprox. -->
            <a-entity
                id="mascara"
                position="0 -0.05 0.05"
                scale="1 1 1">
                <!-- Placeholder: reemplaza por tu modelo glTF de máscara -->
                <a-box
                    color="#333"
                    width="0.18"
                    height="0.12"
                    depth="0.08"
                    position="0 0 0"></a-box>
                <a-sphere
                    color="#555"
                    radius="0.04"
                    position="0 -0.05 0.05"></a-sphere>
            </a-entity>
        </a-entity>

        <!-- ===================================================== -->
        <!--  FIN DE TU ESCENA                                     -->
        <!-- ===================================================== -->

    </a-scene>

    <script>
        (function () {
            var instruccion = document.getElementById('instruccion');
            var btn = document.getElementById('btn-iniciar');
            var arrancado = false;

            function iniciar() {
                if (arrancado) return;
                arrancado = true;

                var scene = document.querySelector('a-scene');

                function start() {
                    try {
                        scene.systems['mindar-face'].start();
                    } catch (e) {
                        console.error('Error al iniciar MindAR:', e);
                    }
                    instruccion.classList.add('oculto');
                }

                if (scene.hasLoaded) start();
                else scene.addEventListener('loaded', start, { once: true });
            }

            btn.addEventListener('click', iniciar, { passive: true });
            btn.addEventListener('touchend', function (e) {
                e.preventDefault();
                iniciar();
            }, { passive: false });

            document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

            document.addEventListener('touchmove', function (e) {
                if (e.touches.length > 1) e.preventDefault();
            }, { passive: false });

            window.addEventListener('resize', function () {
                setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 300);
            });
        })();
    </script>
</body>
</html>
