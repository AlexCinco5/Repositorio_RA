<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 2 - Máscara y Humo</title>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

    <style>
        #instruccion {
            position: absolute; top: 10%; left: 50%; transform: translateX(-50%);
            z-index: 10; background: rgba(0, 0, 0, 0.7); color: #f97316;
            padding: 12px 24px; border-radius: 8px; font-family: sans-serif;
            font-weight: bold; font-size: 16px; text-align: center; pointer-events: none;
        }
    </style>

    <script>
        // Disparador del humo al abrir la boca
        AFRAME.registerComponent('efecto-humo', {
            init: function() {
                this.labioSup = document.querySelector('#labio-sup');
                this.labioInf = document.querySelector('#labio-inf');
                this.efecto = document.querySelector('#humo-particulas');
                this.activo = false;
            },
            tick: function() {
                if (!this.labioSup || !this.labioInf || !this.efecto) return;
                
                let posSup = new THREE.Vector3();
                let posInf = new THREE.Vector3();
                this.labioSup.object3D.getWorldPosition(posSup);
                this.labioInf.object3D.getWorldPosition(posInf);
                
                if (posSup.distanceTo(posInf) > 1.5 && !this.activo) {
                    this.activo = true;
                    this.efecto.setAttribute('visible', 'true');
                    setTimeout(() => {
                        this.efecto.setAttribute('visible', 'false');
                        this.activo = false;
                    }, 2000);
                }
            }
        });
    </script>
</head>
<body style="margin: 0; overflow: hidden;">
    <div id="instruccion">Abre la boca para liberar el humo</div>

    <a-scene mindar-face embedded color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" efecto-humo>
        
        <a-assets>
            <!-- REGLA DE VERCEL/MÓVIL: crossorigin="anonymous" es obligatorio -->
            <!-- Cambia "tu_mascara.png" y "tu_humo.png" por los nombres reales de tus archivos -->
            <img id="textura-mascara" src="tu_mascara.png" crossorigin="anonymous">
            <img id="textura-humo" src="tu_humo.png" crossorigin="anonymous">
        </a-assets>

        <a-camera active="false" position="0 0 0"></a-camera>

        <!-- Anclajes invisibles para la boca -->
        <a-entity id="labio-sup" mindar-face-target="anchorIndex: 13"></a-entity>
        <a-entity id="labio-inf" mindar-face-target="anchorIndex: 14"></a-entity>

        <!-- Anclaje estable a la nariz para móviles -->
        <a-entity mindar-face-target="anchorIndex: 168">
            <!-- Máscara plana calibrada para cubrir el rostro -->
            <a-image src="#textura-mascara" position="0 -0.05 0.05" width="0.75" height="1.0" material="transparent: true; alphaTest: 0.1;"></a-image>
            
            <!-- Efecto de humo -->
            <a-image id="humo-particulas" src="#textura-humo" position="0 -0.5 0.3" scale="1.2 1.2 1.2" visible="false" material="transparent: true; alphaTest: 0.1;"></a-image>
        </a-entity>
        
    </a-scene>
</body>
</html>
