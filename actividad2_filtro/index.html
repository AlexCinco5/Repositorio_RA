<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Filtro de Máscara Mapeada</title>

  <!-- =====================================================
       IMPORTMAP
       Three.js + MindAR Face Tracking
  ====================================================== -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
    }
  }
  </script>

  <!-- =====================================================
       ESTILOS
  ====================================================== -->
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden; background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }
    #container {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      overflow: hidden; background: #000;
    }
    #titulo {
      position: fixed; top: 18px; left: 50%;
      transform: translateX(-50%); z-index: 20;
      color: white; background: rgba(0, 0, 0, 0.55);
      padding: 10px 18px; border-radius: 22px;
      font-size: 15px; font-weight: bold; text-align: center;
      backdrop-filter: blur(6px); pointer-events: none; white-space: nowrap;
    }
    #gesto {
      position: fixed; top: 70px; left: 50%;
      transform: translateX(-50%); z-index: 20;
      color: white; background: rgba(0, 0, 0, 0.45);
      padding: 8px 15px; border-radius: 18px; font-size: 13px;
      text-align: center; pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #estado {
      position: fixed; left: 50%; bottom: 30px;
      transform: translateX(-50%); z-index: 30;
      color: white; background: rgba(0, 0, 0, 0.70);
      padding: 12px 20px; border-radius: 25px; font-size: 14px;
      text-align: center; max-width: 90%; pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #botonEfecto {
      position: fixed; right: 18px; bottom: 20px; z-index: 40;
      border: none; padding: 13px 18px; border-radius: 28px;
      background: #d88924; color: white; font-size: 14px;
      font-weight: bold; cursor: pointer;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s ease, background 0.2s ease;
    }
    #botonEfecto:hover { background: #bd7215; }
    #botonEfecto:active { transform: scale(0.94); }
    #botonAudio {
      position: fixed; left: 18px; bottom: 20px; z-index: 40;
      border: none; padding: 13px 18px; border-radius: 28px;
      background: rgba(0, 0, 0, 0.70); color: white; font-size: 14px;
      font-weight: bold; cursor: pointer;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.30);
      transition: transform 0.2s ease, background 0.2s ease;
    }
    #botonAudio:active { transform: scale(0.94); }
    #flashEfecto {
      position: fixed; inset: 0; z-index: 10;
      pointer-events: none; opacity: 0;
      background: radial-gradient(circle, rgba(255, 190, 70, 0.20), transparent 55%);
      transition: opacity 0.25s ease;
    }
    #flashEfecto.activo { opacity: 1; }
    #error {
      display: none; position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%); z-index: 100;
      width: 85%; max-width: 500px; padding: 25px;
      border-radius: 15px; background: rgba(0, 0, 0, 0.92);
      color: white; text-align: center; line-height: 1.5;
    }
    #error strong { color: #ffb347; }
    @media (max-width: 500px) {
      #titulo { top: 12px; font-size: 13px; padding: 8px 14px; }
      #gesto { top: 58px; font-size: 12px; }
      #botonEfecto { right: 12px; bottom: 15px; padding: 11px 14px; font-size: 12px; }
      #botonAudio { left: 12px; bottom: 15px; padding: 11px 14px; font-size: 12px; }
    }
  </style>
</head>
<body>

  <!-- CONTENEDOR AR -->
  <div id="container"></div>

  <!-- INTERFAZ -->
  <div id="titulo">😷 Filtro Mapeado</div>
  <div id="gesto">👄 Abre la boca para activar el humo</div>
  <div id="estado">Iniciando cámara...</div>
  <div id="flashEfecto"></div>

  <button id="botonAudio" type="button">🔊 Activar sonido</button>
  <button id="botonEfecto" type="button">💨 Probar humo</button>

  <div id="error">
    <strong>No se pudo iniciar la Realidad Aumentada.</strong><br><br>
    Verifica:<br>
    • Cámara frontal disponible<br>
    • Permiso de cámara activado<br>
    • HTTPS o localhost
  </div>

  <!-- AUDIO ACTUALIZADO -->
  <audio id="sonido" src="./alerta.mp3" preload="auto"></audio>

  <!-- JAVASCRIPT -->
  <script type="module">
    import * as THREE from "three";
    import { MindARThree } from "mindar-face-three";

    let mindarThree = null;
    let renderer = null;
    let scene = null;
    let camera = null;
    let faceMesh = null;
    let faceAnchor = null;

    let humos = [];
    let efectoActivo = false;
    let bocaAbierta = false;
    let ultimoDisparo = 0;

    const UMBRAL_ABRIR = 0.22;
    const UMBRAL_CERRAR = 0.14;
    const TIEMPO_ENTRE_DISPAROS = 1200;

    const audio = document.querySelector("#sonido");
    let audioActivado = false;

    const container = document.querySelector("#container");
    const estado = document.querySelector("#estado");
    const gesto = document.querySelector("#gesto");
    const botonEfecto = document.querySelector("#botonEfecto");
    const botonAudio = document.querySelector("#botonAudio");
    const flashEfecto = document.querySelector("#flashEfecto");
    const errorBox = document.querySelector("#error");

    function cambiarEstado(texto) { estado.textContent = texto; }
    function mostrarError(error) {
      console.error("Error AR:", error);
      estado.style.display = "none";
      errorBox.style.display = "block";
    }

    async function activarAudio() {
      try {
        audio.load();
        audio.muted = true;
        await audio.play();
        audio.pause();
        audio.currentTime = 0;
        audio.muted = false;
        audioActivado = true;
        botonAudio.textContent = "🔊 Sonido activo";
        botonAudio.style.background = "rgba(40, 130, 70, 0.85)";
        cambiarEstado("🔊 Sonido activado — abre la boca");
        setTimeout(() => { estado.style.opacity = "0"; }, 2500);
      } catch (error) {
        audioActivado = false;
        botonAudio.textContent = "🔊 Toca para activar sonido";
      }
    }

    async function reproducirSonido() {
      if (!audioActivado) return;
      try {
        audio.pause();
        audio.currentTime = 0;
        await audio.play();
      } catch (error) { }
    }

    botonAudio.addEventListener("click", activarAudio);
    window.addEventListener("pointerdown", () => {
      if (!audioActivado) activarAudio();
    }, { once: true });

    /* =====================================================
       CREAR HUMO EN LUGAR DE PÉTALOS
    ====================================================== */
    function crearHumos() {
      const loader = new THREE.TextureLoader();
      const texturaHumo = loader.load("./humo.png");
      texturaHumo.colorSpace = THREE.SRGBColorSpace;

      const material = new THREE.SpriteMaterial({
        map: texturaHumo,
        transparent: true,
        opacity: 0,
        depthTest: false,
        depthWrite: false
      });

      // Humo Izquierdo
      const humoIzq = new THREE.Sprite(material);
      humoIzq.position.set(-0.35, -0.35, 0.25); 
      humoIzq.scale.set(0.35, 0.35, 0.35);
      humoIzq.visible = false;

      // Humo Derecho
      const humoDer = new THREE.Sprite(material);
      humoDer.position.set(0.35, -0.35, 0.25);
      humoDer.scale.set(0.35, 0.35, 0.35);
      humoDer.visible = false;

      if (faceAnchor) {
        faceAnchor.group.add(humoIzq);
        faceAnchor.group.add(humoDer);
      }
      humos.push(humoIzq, humoDer);
    }

    /* =====================================================
       ACTIVAR / DESACTIVAR EFECTO
    ====================================================== */
    function activarEfectos() {
      efectoActivo = true;
      humos.forEach(humo => {
        humo.visible = true;
        humo.material.opacity = 1;
      });
      botonEfecto.textContent = "💨 Efecto activo";
      botonEfecto.style.background = "#9b5b11";
      flashEfecto.classList.add("activo");
      setTimeout(() => flashEfecto.classList.remove("activo"), 250);
    }

    function desactivarEfectos() {
      efectoActivo = false;
      humos.forEach(humo => {
        humo.visible = false;
        humo.material.opacity = 0;
      });
      botonEfecto.textContent = "💨 Probar humo";
      botonEfecto.style.background = "#d88924";
      
      // Apagar sonido al cerrar la boca
      audio.pause();
    }

    async function dispararEfecto() {
      const ahora = performance.now();
      if (ahora - ultimoDisparo < TIEMPO_ENTRE_DISPAROS) return;
      ultimoDisparo = ahora;

      activarEfectos();
      await reproducirSonido();

      gesto.textContent = "💨 ¡Humo y alerta activados!";
      gesto.style.transform = "translateX(-50%) scale(1.08)";
      setTimeout(() => {
        gesto.textContent = "👄 Abre la boca para activar el humo";
        gesto.style.transform = "translateX(-50%) scale(1)";
      }, 1600);
    }

    botonEfecto.addEventListener("click", async () => {
      if (!audioActivado) await activarAudio();
      await dispararEfecto();
    });

    /* =====================================================
       CALCULAR APERTURA DE BOCA
    ====================================================== */
    function calcularAperturaBoca() {
      if (!faceMesh || !faceMesh.geometry || !faceMesh.geometry.attributes.position) return 0;
      const posiciones = faceMesh.geometry.attributes.position;
      if (posiciones.count <= 291) return 0;

      const superior = new THREE.Vector3().fromBufferAttribute(posiciones, 13);
      const inferior = new THREE.Vector3().fromBufferAttribute(posiciones, 14);
      const esquinaIzquierda = new THREE.Vector3().fromBufferAttribute(posiciones, 61);
      const esquinaDerecha = new THREE.Vector3().fromBufferAttribute(posiciones, 291);

      const apertura = superior.distanceTo(inferior);
      const ancho = esquinaIzquierda.distanceTo(esquinaDerecha);

      if (ancho < 0.0001) return 0;
      return apertura / ancho;
    }

    function detectarBoca() {
      const apertura = calcularAperturaBoca();

      if (!bocaAbierta && apertura >= UMBRAL_ABRIR) {
        bocaAbierta = true;
        dispararEfecto();
      } else if (bocaAbierta && apertura <= UMBRAL_CERRAR) {
        bocaAbierta = false;
        desactivarEfectos();
      }
    }

    /* =====================================================
       INICIALIZAR MINDAR
    ====================================================== */
    async function iniciarAR() {
      try {
        cambiarEstado("Cargando Realidad Aumentada...");

        mindarThree = new MindARThree({
          container: container,
          uiLoading: "yes",
          uiScanning: "yes",
          uiError: "yes",
          resolution: "720p",
          filterMinCF: 0.001,
          filterBeta: 1.0
        });

        renderer = mindarThree.renderer;
        scene = mindarThree.scene;
        camera = mindarThree.camera;

        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0);

        const luz = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
        scene.add(luz);

        // CREAR FACE MESH
        faceMesh = mindarThree.addFaceMesh();

        // CARGAR TEXTURA DEL FILTRO ACTUALIZADO
        const loader = new THREE.TextureLoader();
        const textura = await new Promise((resolve, reject) => {
          loader.load("./filtro_2.png", resolve, undefined, reject);
        });

        textura.colorSpace = THREE.SRGBColorSpace;
        textura.needsUpdate = true;

        faceMesh.material = new THREE.MeshBasicMaterial({
          map: textura,
          transparent: true,
          alphaTest: 0.01,
          side: THREE.DoubleSide,
          depthWrite: false,
          depthTest: true
        });

        scene.add(faceMesh);

        // ANCHOR FACIAL
        faceAnchor = mindarThree.addAnchor(1);

        // CREAR HUMO
        crearHumos();

        cambiarEstado("Solicitando acceso a la cámara...");
        await mindarThree.start();

        cambiarEstado("✨ Rostro detectado — abre la boca");
        setTimeout(() => { estado.style.opacity = "0"; }, 4000);

        renderer.setAnimationLoop(() => {
          detectarBoca();
          renderer.render(scene, camera);
        });

      } catch (error) {
        mostrarError(error);
      }
    }

    window.addEventListener("resize", () => {
      if (!renderer) return;
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    iniciarAR();

  </script>
</body>
</html>
