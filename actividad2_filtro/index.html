<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>Filtro RA - Máscara de Gas (Boca Reactiva)</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>

    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #000;
            touch-action: none; overscroll-behavior: none;
            -webkit-user-select: none; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        a-scene {
            position: fixed !important;
            top: 0; left: 0;
            width: 100% !important;
            height: 100% !important;
        }

        .a-enter-vr, .a-enter-ar, .a-orientation-modal, .a-loader-title {
            display: none !important;
        }

        #instruccion {
            position: fixed; top: 10%; left: 50%; transform: translateX(-50%);
            z-index: 10; background: rgba(0, 0, 0, 0.7); color: #4ade80;
            padding: 12px 24px; border-radius: 8px; font-family: sans-serif;
            font-weight: bold; font-size: 16px; text-align: center;
            pointer-events: none;
        }

        #overlay-inicio {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #000; color: #fff; text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 16px; padding: 24px; box-sizing: border-box;
        }
        #overlay-inicio.oculto { display: none; }
        #overlay-inicio p { max-width: 420px; line-height: 1.5; margin: 0 0 8px 0; }

        #btn-iniciar {
            margin-top: 24px; padding: 16px 40px; font-size: 18px;
            font-weight: 700; border: 0; border-radius: 40px;
            background: #ff3b30; color: #fff; cursor: pointer;
            -webkit-appearance: none; appearance: none;
            touch-action: manipulation;
        }

        #mensaje-error {
            margin-top: 20px; color: #ff6b6b; font-size: 14px;
            max-width: 420px; line-height: 1.5; display: none;
            white-space: pre-wrap; word-break: break-word;
        }
        #mensaje-error.visible { display: block; }

        #estado {
            margin-top: 16px; color: #4ade80; font-size: 14px;
            min-height: 20px;
        }
    </style>

    <script>
        AFRAME.registerComponent('oclusor-invisible', {
            init: function () {
                this.el.addEventListener('model-loaded', () => {
                    const obj = this.el.getObject3D('mesh');
                    if (obj) {
                        obj.traverse((node) => {
                            if (node.isMesh && node.material) {
                                node.material.colorWrite = false;
                                node.renderOrder = -1;
                            }
                        });
                    }
                });
            }
        });

        AFRAME.registerComponent('detector-gesto-boca', {
            init: function() {
                this.labioSup = document.querySelector('#labio-sup');
                this.labioInf = document.querySelector('#labio-inf');
                this.humoIzq = document.querySelector('#humo-izquierdo');
                this.humoDer = document.querySelector('#humo-derecho');
                this.sonido = document.querySelector('#alerta-gas');
                this.activo = false;
            },
            tick: function() {
                if (!this.labioSup || !this.labioInf) return;
                if (!this.labioSup.object3D || !this.labioInf.object3D) return;

                let posSup = new THREE.Vector3();
                let posInf = new THREE.Vector3();
                this.labioSup.object3D.getWorldPosition(posSup);
                this.labioInf.object3D.getWorldPosition(posInf);

                let distancia = posSup.distanceTo(posInf);

                if (distancia > 1.5 && !this.activo) {
                    this.activo = true;

                    if (this.humoIzq) this.humoIzq.setAttribute('visible', 'true');
                    if (this.humoDer) this.humoDer.setAttribute('visible', 'true');

                    if (this.sonido && this.sonido.components && this.sonido.components.sound) {
                        try { this.sonido.components.sound.playSound(); } catch (e) {}
                    }

                    setTimeout(() => {
                        if (this.humoIzq) this.humoIzq.setAttribute('visible', 'false');
                        if (this.humoDer) this.humoDer.setAttribute('visible', 'false');
                        this.activo = false;
                    }, 2000);
                }
            }
        });
    </script>
</head>
<body>

    <div id="overlay-inicio">
        <p>Para usar la máscara de gas necesitamos acceso a tu cámara.</p>
        <p><strong>Toca INICIAR</strong> y acepta el permiso cuando el navegador lo pida.</p>
        <button id="btn-iniciar" type="button">INICIAR</button>
        <div id="estado"></div>
        <div id="mensaje-error"></div>
    </div>

    <div id="instruccion">Toca la pantalla y abre la boca</div>

    <a-scene
        mindar-face="autoStart: false; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 5; warmupTolerance: 3"
        embedded
        color-space="sRGB"
        renderer="colorManagement: true; physicallyCorrectLights: false; antialias: false; precision: mediump; alpha: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        loading-screen="enabled: false"
        detector-gesto-boca>

        <a-assets timeout="15000">
            <a-asset-item id="mascara-gas" src="mascara_gas.glb"></a-asset-item>
            <a-asset-item id="cabeza-molde" src="headOccluder.glb"></a-asset-item>
            <audio id="audio-gas" src="alerta.mp3" preload="auto" crossorigin="anonymous"></audio>
            <img id="textura-humo" src="humo.png" crossorigin="anonymous">
        </a-assets>

        <a-light type="ambient" color="#ffffff" intensity="1.2"></a-light>
        <a-light type="directional" color="#ffffff" position="0 1 1" intensity="0.8"></a-light>

        <a-camera active="false" position="0 0 0"></a-camera>

        <a-entity id="labio-sup" mindar-face-target="anchorIndex: 13"></a-entity>
        <a-entity id="labio-inf" mindar-face-target="anchorIndex: 14"></a-entity>

        <a-entity mindar-face-target="anchorIndex: 168">

            <a-entity gltf-model="#cabeza-molde" oclusor-invisible scale="0.075 0.075 0.075"></a-entity>

            <a-entity
                gltf-model="#mascara-gas"
                rotation="0 180 0"
                position="0 -0.25 0.05"
                scale="1.6 1.6 1.6"
                animation-mixer>
            </a-entity>

            <a-image id="humo-izquierdo" src="#textura-humo" position="-0.7 -0.45 0.7" rotation="0 0 20" scale="0.4 0.4 0.4" visible="false"></a-image>
            <a-image id="humo-derecho" src="#textura-humo" position="0.7 -0.45 0.7" rotation="0 0 -20" scale="0.4 0.4 0.4" visible="false"></a-image>

            <a-entity id="alerta-gas" sound="src: #audio-gas; volume: 1; poolSize: 2"></a-entity>

        </a-entity>
    </a-scene>

    <script>
        (function () {
            var overlay = document.getElementById('overlay-inicio');
            var btn = document.getElementById('btn-iniciar');
            var estado = document.getElementById('estado');
            var errorBox = document.getElementById('mensaje-error');
            var arrancado = false;

            function mostrarError(msg) {
                errorBox.textContent = msg;
                errorBox.classList.add('visible');
                estado.textContent = '';
                btn.disabled = false;
                btn.textContent = 'REINTENTAR';
                arrancado = false;
            }

            function mostrarEstado(msg) {
                estado.textContent = msg;
            }

            // Detección previa: HTTPS obligatorio para cámara en móvil
            function esContextoSeguro() {
                return window.isSecureContext ||
                       location.protocol === 'https:' ||
                       location.hostname === 'localhost' ||
                       location.hostname === '127.0.0.1';
            }

            // FORZAR el diálogo de permiso de cámara llamando a getUserMedia
            // ANTES de arrancar MindAR. Esto es lo que hace aparecer el popup.
            async function pedirPermisoCamara() {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error(
                        'Este navegador no soporta acceso a la cámara (getUserMedia).\n' +
                        'Prueba abriendo el enlace en Chrome (Android) o Safari (iOS) directamente, ' +
                        'no dentro de WhatsApp, Instagram o Facebook.'
                    );
                }

                mostrarEstado('Solicitando permiso de cámara...');

                var stream;
                try {
                    // facingMode user = cámara frontal
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'user' },
                        audio: false
                    });
                } catch (err) {
                    var nombre = err && err.name ? err.name : 'Error';
                    var mensajes = {
                        'NotAllowedError':
                            'Permiso de cámara DENEGADO.\n' +
                            'Ve a la configuración del sitio en tu navegador, ' +
                            'permite el acceso a la cámara y recarga la página.',
                        'PermissionDeniedError':
                            'Permiso de cámara DENEGADO.\n' +
                            'Ve a la configuración del sitio en tu navegador, ' +
                            'permite el acceso a la cámara y recarga la página.',
                        'NotFoundError':
                            'No se encontró ninguna cámara en este dispositivo.',
                        'DevicesNotFoundError':
                            'No se encontró ninguna cámara en este dispositivo.',
                        'NotReadableError':
                            'La cámara está siendo usada por otra aplicación.\n' +
                            'Cierra otras apps que usen la cámara e inténtalo de nuevo.',
                        'TrackStartError':
                            'La cámara está siendo usada por otra aplicación.\n' +
                            'Cierra otras apps que usen la cámara e inténtalo de nuevo.',
                        'OverconstrainedError':
                            'La cámara no cumple los requisitos solicitados.',
                        'SecurityError':
                            'Bloqueado por seguridad.\n' +
                            'Debes abrir la página por HTTPS (no por http:// ni file://).'
                    };
                    throw new Error(mensajes[nombre] || (nombre + ': ' + (err.message || 'error desconocido')));
                }

                // Ya tenemos permiso: cerramos el stream de prueba.
                // MindAR abrirá el suyo propio a continuación.
                stream.getTracks().forEach(function (t) { t.stop(); });

                mostrarEstado('Permiso concedido ✓ Iniciando cámara...');
            }

            function arrancarMindAR() {
                var scene = document.querySelector('a-scene');

                function start() {
                    try {
                        scene.systems['mindar-face'].start();
                    } catch (e) {
                        console.error('Error al iniciar MindAR:', e);
                        mostrarError('Error al iniciar MindAR: ' + (e.message || e));
                        return;
                    }
                    overlay.classList.add('oculto');
                }

                if (scene.hasLoaded) start();
                else scene.addEventListener('loaded', start, { once: true });
            }

            async function iniciar() {
                if (arrancado) return;
                arrancado = true;
                btn.disabled = true;
                errorBox.classList.remove('visible');
                errorBox.textContent = '';

                // 1) HTTPS obligatorio
                if (!esContextoSeguro()) {
                    mostrarError(
                        'Esta página NO está en HTTPS.\n\n' +
                        'Los navegadores móviles bloquean la cámara sin HTTPS. ' +
                        'Súbela a GitHub Pages, Netlify, Vercel o cualquier hosting con SSL ' +
                        'y vuelve a intentarlo desde esa URL https://...'
                    );
                    return;
                }

                // 2) Forzar diálogo de permiso
                try {
                    await pedirPermisoCamara();
                } catch (e) {
                    mostrarError(e.message || String(e));
                    return;
                }

                // 3) Arrancar MindAR
                arrancarMindAR();
            }

            // Listeners en click Y touchend: algunos Android no disparan click rápido
            btn.addEventListener('click', iniciar, { passive: true });
            btn.addEventListener('touchend', function (e) {
                e.preventDefault();
                iniciar();
            }, { passive: false });

            document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

            document.addEventListener('touchmove', function (e) {
                if (e.touches.length > 1) e.preventDefault();
            }, { passive: false });

            window.addEventListener('resize', function () {
                setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 300);
            });
            window.addEventListener('orientationchange', function () {
                setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 500);
            });
            window.addEventListener('load', function () {
                setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 1500);
            });

            // Si no está en contexto seguro, avisamos de inmediato al cargar
            if (!esContextoSeguro()) {
                mostrarError(
                    '⚠ Esta página no está en HTTPS.\n\n' +
                    'La cámara NO funcionará en el celular sin HTTPS. ' +
                    'Súbela a un hosting con SSL (GitHub Pages, Netlify, Vercel) ' +
                    'y ábrela desde esa URL https://...'
                );
            }
        })();
    </script>
</body>
</html>
