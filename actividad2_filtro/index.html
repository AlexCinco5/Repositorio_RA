<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtro RA - Máscara de Gas (Ajuste Final)</title>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

    <!-- Componente para hacer invisible el molde de la cabeza pero mantener la oclusión -->
    <script>
        AFRAME.registerComponent('oclusor-invisible', {
            init: function () {
                this.el.addEventListener('model-loaded', () => {
                    const obj = this.el.getObject3D('mesh');
                    if (obj) {
                        obj.traverse((node) => {
                            if (node.isMesh && node.material) {
                                // Apaga la renderización de color del molde
                                node.material.colorWrite = false;
                            }
                        });
                    }
                });
            }
        });
    </script>
</head>
<body style="margin: 0; overflow: hidden;">
    
    <a-scene mindar-face embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <!-- Asegúrate de que tu archivo se llame exactamente así -->
            <a-asset-item id="mascara-gas" src="mascara_gas.glb"></a-asset-item>
            <a-asset-item id="cabeza-molde" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/sparkar/headOccluder.glb"></a-asset-item>
        </a-assets>

        <a-camera active="false" position="0 0 0"></a-camera>

        <!-- Anclaje facial en el puente de la nariz (168) -->
        <a-entity mindar-face-target="anchorIndex: 168">
            
            <!-- 1. CABEZA DE REFERENCIA (Oculta, pero bloquea la parte trasera de la máscara) -->
            <a-entity gltf-model="#cabeza-molde" oclusor-invisible scale="0.065 0.065 0.065"></a-entity>
            
            <!-- 2. MÁSCARA DE GAS CALIBRADA -->
            <!-- Si necesitas afinarlo: 
                 - position: Modifica -0.6 para subirla o bajarla. Modifica 0.1 para sacarla o hundirla.
                 - scale: Aumenta o disminuye los 3 valores (1.6) al mismo tiempo para el tamaño general. -->
            <a-entity 
                gltf-model="#mascara-gas" 
                rotation="0 180 0" 
                position="0 -0.6 0.1" 
                scale="1.6 1.6 1.6">
            </a-entity>
            
        </a-entity>
    </a-scene>

    <!-- Script para solucionar el bug de pantalla congelada (Evita tener que presionar F12) -->
    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                window.dispatchEvent(new Event('resize'));
            }, 1500);
        });
    </script>
</body>
</html>
