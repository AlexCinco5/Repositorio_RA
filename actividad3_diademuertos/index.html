  <meta

    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Máscara de Día de Muertos - Realidad Aumentada</title>


  <!-- =====================================================
       IMPORTMAP
       Three.js + MindAR Face Tracking
  ====================================================== -->

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
    }
  }
  </script>


  <!-- =====================================================
       ESTILOS
  ====================================================== -->

  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }


    /* =====================================================
       CONTENEDOR PRINCIPAL
    ====================================================== */

    #container {

      position: fixed;

      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      overflow: hidden;

      background: #000;
    }


    /* =====================================================
       TITULO
    ====================================================== */

    #titulo {

      position: fixed;

      top: 18px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 20;

      color: white;

      background: rgba(0, 0, 0, 0.55);

      padding: 10px 18px;

      border-radius: 22px;

      font-size: 15px;

      font-weight: bold;

      text-align: center;

      backdrop-filter: blur(6px);

      pointer-events: none;

      white-space: nowrap;
    }


    /* =====================================================
       INDICADOR DE GESTO
    ====================================================== */

    #gesto {

      position: fixed;

      top: 70px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 20;

      color: white;

      background: rgba(0, 0, 0, 0.45);

      padding: 8px 15px;

      border-radius: 18px;

      font-size: 13px;

      text-align: center;

      pointer-events: none;

      transition:
        opacity 0.3s ease,
        transform 0.3s ease;
    }


    /* =====================================================
       MENSAJE DE ESTADO
    ====================================================== */

    #estado {

      position: fixed;

      left: 50%;
      bottom: 30px;

      transform: translateX(-50%);

      z-index: 30;

      color: white;

      background: rgba(0, 0, 0, 0.70);

      padding: 12px 20px;

      border-radius: 25px;

      font-size: 14px;

      text-align: center;

      max-width: 90%;

      pointer-events: none;

      transition:
        opacity 0.4s ease;
    }


    /* =====================================================
       BOTON DE PRUEBA
    ====================================================== */

    #botonEfecto {

      position: fixed;

      right: 18px;
      bottom: 20px;

      z-index: 40;

      border: none;

      padding: 13px 18px;

      border-radius: 28px;

      background: #d88924;

      color: white;

      font-size: 14px;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.35);

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }


    #botonEfecto:hover {

      background: #bd7215;
    }


    #botonEfecto:active {

      transform: scale(0.94);
    }


    /* =====================================================
       BOTON DE AUDIO
    ====================================================== */

    #botonAudio {

      position: fixed;

      left: 18px;
      bottom: 20px;

      z-index: 40;

      border: none;

      padding: 13px 18px;

      border-radius: 28px;

      background: rgba(0, 0, 0, 0.70);

      color: white;

      font-size: 14px;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.30);

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }


    #botonAudio:active {

      transform: scale(0.94);
    }


    /* =====================================================
       EFECTO VISUAL CUANDO SE ABRE LA BOCA
    ====================================================== */

    #flashEfecto {

      position: fixed;

      inset: 0;

      z-index: 10;

      pointer-events: none;

      opacity: 0;

      background:
        radial-gradient(
          circle,
          rgba(255, 190, 70, 0.20),
          transparent 55%
        );

      transition:
        opacity 0.25s ease;
    }


    #flashEfecto.activo {

      opacity: 1;
    }


    /* =====================================================
       ERROR
    ====================================================== */

    #error {

      display: none;

      position: fixed;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      z-index: 100;

      width: 85%;

      max-width: 500px;

      padding: 25px;

      border-radius: 15px;

      background: rgba(0, 0, 0, 0.92);

      color: white;

      text-align: center;

      line-height: 1.5;
    }


    #error strong {

      color: #ffb347;
    }


    /* =====================================================
       RESPONSIVE
    ====================================================== */

    @media (max-width: 500px) {

      #titulo {

        top: 12px;

        font-size: 13px;

        padding: 8px 14px;
      }


      #gesto {

        top: 58px;

        font-size: 12px;
      }


      #botonEfecto {

        right: 12px;

        bottom: 15px;

        padding: 11px 14px;

        font-size: 12px;
      }


      #botonAudio {

        left: 12px;

        bottom: 15px;

        padding: 11px 14px;

        font-size: 12px;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       CONTENEDOR AR
  ====================================================== -->

  <div id="container"></div>


  <!-- =====================================================
       TITULO
  ====================================================== -->

  <div id="titulo">

    💀 Máscara de Día de Muertos

  </div>


  <!-- =====================================================
       INDICADOR DE GESTO
  ====================================================== -->

  <div id="gesto">

    👄 Abre la boca para activar el efecto

  </div>


  <!-- =====================================================
       ESTADO
  ====================================================== -->

  <div id="estado">

    Iniciando cámara...

  </div>


  <!-- =====================================================
       FLASH VISUAL
  ====================================================== -->

  <div id="flashEfecto"></div>


  <!-- =====================================================
       BOTON DE AUDIO
       
       Necesario porque algunos navegadores móviles
       bloquean audio hasta que existe una interacción
       del usuario.
  ====================================================== -->

  <button
    id="botonAudio"
    type="button"
  >

    🔊 Activar sonido

  </button>


  <!-- =====================================================
       BOTON MANUAL DE PRUEBA
       
       El gesto de la boca sigue siendo la interacción
       principal.
  ====================================================== -->

  <button
    id="botonEfecto"
    type="button"
  >

    🌼 Probar efecto

  </button>


  <!-- =====================================================
       ERROR
  ====================================================== -->

  <div id="error">

    <strong>
      No se pudo iniciar la Realidad Aumentada.
    </strong>

    <br><br>

    Verifica:

    <br>

    • Cámara frontal disponible<br>
    • Permiso de cámara activado<br>
    • Chrome/Safari actualizado<br>
    • HTTPS o localhost<br>
    • Buena iluminación

  </div>


  <!-- =====================================================
       AUDIO
       
       Este archivo ya existe en tu carpeta assets.
  ====================================================== -->

  <audio
    id="sonido"
    src="./assets/sonido_misterio.mp3"
    preload="auto"
  ></audio>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script type="module">


    /* =====================================================
       IMPORTACIONES
    ====================================================== */

    import * as THREE from "three";

    import {
      MindARThree
    } from "mindar-face-three";


    /* =====================================================
       VARIABLES PRINCIPALES
    ====================================================== */

    let mindarThree = null;

    let renderer = null;

    let scene = null;

    let camera = null;

    let faceMesh = null;

    let faceAnchor = null;


    /* =====================================================
       PETALOS
    ====================================================== */

    let petalos = [];

    let efectoActivo = false;

    let tiempoPetalos = 0;


    /* =====================================================
       DETECCION DE BOCA
    ====================================================== */

    let bocaAbierta = false;

    let ultimoDisparo = 0;

    let ultimoEstadoBoca = false;


    /*
     * Umbral para considerar que la boca está abierta.
     *
     * Se utilizan dos umbrales:
     *
     * 0.22 -> abre
     * 0.14 -> cierra
     *
     * Esto se llama histéresis y evita que el efecto
     * parpadee cuando estamos justo en el límite.
     */

    const UMBRAL_ABRIR = 0.22;

    const UMBRAL_CERRAR = 0.14;


    /*
     * Tiempo mínimo entre activaciones.
     *
     * Evita que el sonido se reproduzca
     * demasiadas veces.
     */

    const TIEMPO_ENTRE_DISPAROS = 1200;


    /* =====================================================
       AUDIO
    ====================================================== */

    const audio =
      document.querySelector("#sonido");

    let audioActivado = false;


    /* =====================================================
       ELEMENTOS HTML
    ====================================================== */

    const container =
      document.querySelector("#container");

    const estado =
      document.querySelector("#estado");

    const gesto =
      document.querySelector("#gesto");

    const botonEfecto =
      document.querySelector("#botonEfecto");

    const botonAudio =
      document.querySelector("#botonAudio");

    const flashEfecto =
      document.querySelector("#flashEfecto");

    const errorBox =
      document.querySelector("#error");


    /* =====================================================
       CAMBIAR ESTADO
    ====================================================== */

    function cambiarEstado(texto) {

      estado.textContent = texto;

    }


    /* =====================================================
       MOSTRAR ERROR
    ====================================================== */

    function mostrarError(error) {

      console.error(
        "Error de Realidad Aumentada:",
        error
      );

      estado.style.display = "none";

      errorBox.style.display = "block";

    }


    /* =====================================================
       ACTIVAR AUDIO
       
       Los navegadores móviles suelen bloquear audio
       automático hasta que el usuario interactúa.
    ====================================================== */

    async function activarAudio() {

      try {

        /*
         * Intentamos cargar el audio.
         */

        audio.load();


        /*
         * Reproducimos muy brevemente para conseguir
         * la autorización del navegador.
         */

        audio.muted = true;

        await audio.play();

        audio.pause();

        audio.currentTime = 0;

        audio.muted = false;


        audioActivado = true;


        botonAudio.textContent =
          "🔊 Sonido activo";


        botonAudio.style.background =
          "rgba(40, 130, 70, 0.85)";


        cambiarEstado(
          "🔊 Sonido activado — abre la boca"
        );


        setTimeout(
          () => {

            estado.style.opacity = "0";

          },
          2500
        );


      }

      catch (error) {

        console.warn(
          "El navegador bloqueó el audio:",
          error
        );

        audioActivado = false;

        botonAudio.textContent =
          "🔊 Toca para activar sonido";

      }

    }


    /* =====================================================
       REPRODUCIR SONIDO
    ====================================================== */

    async function reproducirSonido() {

      /*
       * Si todavía no está desbloqueado,
       * no intentamos forzar reproducción.
       */

      if (!audioActivado) {

        return;

      }


      try {

        audio.pause();

        audio.currentTime = 0;

        await audio.play();

      }

      catch (error) {

        console.warn(
          "No se pudo reproducir el sonido:",
          error
        );

      }

    }


    /* =====================================================
       BOTON DE AUDIO
    ====================================================== */

    botonAudio.addEventListener(
      "click",
      activarAudio
    );


    /*
     * Intentar desbloquear el audio con la primera
     * interacción del usuario.
     *
     * Esto ayuda especialmente en teléfonos.
     */

    window.addEventListener(
      "pointerdown",
      () => {

        if (!audioActivado) {

          activarAudio();

        }

      },
      {
        once: true
      }
    );


    /* =====================================================
       CREAR PETALOS
    ====================================================== */

    function crearPetalos() {


      const loader =
        new THREE.TextureLoader();


      const texturaPetalos =
        loader.load(

          "./assets/petalos.png",

          () => {

            console.log(
              "Textura de pétalos cargada correctamente."
            );

          },

          undefined,

          (error) => {

            console.error(
              "No se pudo cargar petalos.png",
              error
            );

          }

        );


      texturaPetalos.colorSpace =
        THREE.SRGBColorSpace;


      /*
       * Creamos varios pétalos.
       */

      for (let i = 0; i < 14; i++) {


        const material =
          new THREE.SpriteMaterial({

            map: texturaPetalos,

            transparent: true,

            opacity: 0,

            depthTest: false,

            depthWrite: false

          });


        const petalo =
          new THREE.Sprite(material);


        /*
         * Distribución alrededor de la cara.
         */

        const angulo =
          (i / 14) *
          Math.PI *
          2;


        const radio =
          0.35 +
          Math.random() * 0.35;


        petalo.position.set(

          Math.cos(angulo) * radio,

          Math.sin(angulo) * radio,

          0.25

        );


        /*
         * Tamaño aleatorio.
         */

        const escala =
          0.07 +
          Math.random() * 0.06;


        petalo.scale.set(
          escala,
          escala,
          escala
        );


        /*
         * Estado inicial.
         */

        petalo.visible = false;


        /*
         * Añadimos los pétalos al anchor facial.
         *
         * De esta forma siguen el movimiento de la cara.
         */

        if (faceAnchor) {

          faceAnchor.group.add(
            petalo
          );

        }


        petalos.push({

          objeto: petalo,

          velocidad:
            0.002 +
            Math.random() * 0.004,

          offset:
            Math.random() *
            Math.PI *
            2,

          velocidadRotacion:
            0.01 +
            Math.random() * 0.025

        });

      }

    }


    /* =====================================================
       ACTIVAR PETALOS
    ====================================================== */

    function activarPetalos() {

      efectoActivo = true;


      petalos.forEach(
        (petalo) => {

          petalo.objeto.visible = true;

          petalo.objeto.material.opacity = 1;

          /*
           * Reiniciar posición vertical.
           */

          if (
            petalo.objeto.position.y > 1
          ) {

            petalo.objeto.position.y =
              -0.6;

          }

        }
      );


      botonEfecto.textContent =
        "🌼 Efecto activo";


      botonEfecto.style.background =
        "#9b5b11";


      /*
       * Efecto visual.
       */

      flashEfecto.classList.add(
        "activo"
      );


      setTimeout(
        () => {

          flashEfecto.classList.remove(
            "activo"
          );

        },
        250
      );

    }


    /* =====================================================
       DESACTIVAR PETALOS
    ====================================================== */

    function desactivarPetalos() {

      efectoActivo = false;


      petalos.forEach(
        (petalo) => {

          petalo.objeto.visible =
            false;

          petalo.objeto.material.opacity =
            0;

        }
      );


      botonEfecto.textContent =
        "🌼 Probar efecto";


      botonEfecto.style.background =
        "#d88924";

    }


    /* =====================================================
       ACTIVAR EFECTO COMPLETO
    ====================================================== */

    async function dispararEfecto() {

      const ahora =
        performance.now();


      /*
       * Evitar disparos demasiado rápidos.
       */

      if (
        ahora - ultimoDisparo <
        TIEMPO_ENTRE_DISPAROS
      ) {

        return;

      }


      ultimoDisparo =
        ahora;


      /*
       * Activar pétalos.
       */

      activarPetalos();


      /*
       * Reproducir sonido.
       */

      await reproducirSonido();


      /*
       * Mensaje.
       */

      gesto.textContent =
        "🌼 ¡Efecto de cempasúchil activado!";


      gesto.style.transform =
        "translateX(-50%) scale(1.08)";


      setTimeout(
        () => {

          gesto.textContent =
            "👄 Abre la boca para activar el efecto";


          gesto.style.transform =
            "translateX(-50%) scale(1)";

        },
        1600
      );

    }


    /* =====================================================
       BOTON MANUAL
       
       Sirve como respaldo para demostrar el efecto
       durante la presentación.
    ====================================================== */

    botonEfecto.addEventListener(
      "click",
      async () => {

        /*
         * Si el sonido todavía no está activado,
         * aprovechamos el click para desbloquearlo.
         */

        if (!audioActivado) {

          await activarAudio();

        }


        await dispararEfecto();

      }
    );


    /* =====================================================
       CALCULAR APERTURA DE BOCA
       
       Índices de MediaPipe Face Mesh:
       
       13  = labio superior
       14  = labio inferior
       61  = esquina izquierda
       291 = esquina derecha
       
       Medimos:

       apertura vertical
       -----------------
       ancho de boca

       Esto permite normalizar el resultado
       independientemente del tamaño de la cara.
    ====================================================== */

    function calcularAperturaBoca() {

      if (!faceMesh) {

        return 0;

      }


      if (
        !faceMesh.geometry ||
        !faceMesh.geometry.attributes ||
        !faceMesh.geometry.attributes.position
      ) {

        return 0;

      }


      const posiciones =
        faceMesh.geometry
          .attributes
          .position;


      /*
       * Comprobar que existen suficientes vértices.
       */

      if (
        posiciones.count <= 291
      ) {

        return 0;

      }


      const superior =
        new THREE.Vector3();


      const inferior =
        new THREE.Vector3();


      const esquinaIzquierda =
        new THREE.Vector3();


      const esquinaDerecha =
        new THREE.Vector3();


      /*
       * Obtener posiciones.
       */

      superior.fromBufferAttribute(
        posiciones,
        13
      );


      inferior.fromBufferAttribute(
        posiciones,
        14
      );


      esquinaIzquierda.fromBufferAttribute(
        posiciones,
        61
      );


      esquinaDerecha.fromBufferAttribute(
        posiciones,
        291
      );


      /*
       * Distancia vertical.
       */

      const apertura =
        superior.distanceTo(
          inferior
        );


      /*
       * Ancho de boca.
       */

      const ancho =
        esquinaIzquierda.distanceTo(
          esquinaDerecha
        );


      /*
       * Evitar división entre cero.
       */

      if (ancho < 0.0001) {

        return 0;

      }


      /*
       * Ratio normalizado.
       */

      return apertura / ancho;

    }


    /* =====================================================
       DETECTAR GESTO DE BOCA
    ====================================================== */

    function detectarBoca() {

      const apertura =
        calcularAperturaBoca();


      /*
       * Si la boca está cerrada y supera
       * el umbral de apertura...
       */

      if (
        !bocaAbierta &&
        apertura >= UMBRAL_ABRIR
      ) {

        bocaAbierta = true;

        ultimoEstadoBoca = true;


        /*
         * DISPARAR EFECTO
         */

        dispararEfecto();

      }


      /*
       * Para considerar que la boca se cerró
       * utilizamos un umbral menor.
       */

      else if (
        bocaAbierta &&
        apertura <= UMBRAL_CERRAR
      ) {

        bocaAbierta = false;

        ultimoEstadoBoca = false;


        /*
         * Desactivar pétalos.
         */

        desactivarPetalos();

      }

    }


    /* =====================================================
       ANIMAR PETALOS
    ====================================================== */

    function animarPetalos() {

      if (!efectoActivo) {

        return;

      }


      tiempoPetalos += 0.01;


      petalos.forEach(
        (petalo) => {

          const objeto =
            petalo.objeto;


          /*
           * Movimiento hacia arriba.
           */

          objeto.position.y +=
            petalo.velocidad;


          /*
           * Movimiento lateral suave.
           */

          objeto.position.x +=

            Math.sin(
              tiempoPetalos +
              petalo.offset
            ) * 0.0015;


          /*
           * Rotación.
           */

          objeto.rotation.z +=
            petalo.velocidadRotacion;


          /*
           * Si el pétalo sale por arriba,
           * vuelve a comenzar abajo.
           */

          if (
            objeto.position.y >
            1.0
          ) {

            objeto.position.y =
              -0.8;

          }

        }
      );

    }


    /* =====================================================
       INICIALIZAR MINDAR
    ====================================================== */

    async function iniciarAR() {

      try {


        cambiarEstado(
          "Cargando Realidad Aumentada..."
        );


        /* -----------------------------------------------
           Crear MindAR
        ------------------------------------------------ */

        mindarThree =
          new MindARThree({

            container:
              container,

            uiLoading:
              "yes",

            uiScanning:
              "yes",

            uiError:
              "yes",

            resolution:
              "720p",

            /*
             * Suavizado del tracking.
             */

            filterMinCF:
              0.001,

            filterBeta:
              1.0

          });


        /* -----------------------------------------------
           Obtener elementos Three.js
        ------------------------------------------------ */

        renderer =
          mindarThree.renderer;

        scene =
          mindarThree.scene;

        camera =
          mindarThree.camera;


        /* -----------------------------------------------
           Configuración renderer
        ------------------------------------------------ */

        renderer.setPixelRatio(

          Math.min(
            window.devicePixelRatio,
            2
          )

        );


        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );


        renderer.setClearColor(
          0x000000,
          0
        );


        /* -----------------------------------------------
           Luz
        ------------------------------------------------ */

        const luz =
          new THREE.HemisphereLight(

            0xffffff,

            0xbbbbff,

            1

          );


        scene.add(luz);


        /* -----------------------------------------------
           CREAR FACE MESH
        ------------------------------------------------ */

        faceMesh =
          mindarThree.addFaceMesh();


        /* -----------------------------------------------
           CARGAR TEXTURA DE MASCARA
        ------------------------------------------------ */

        const loader =
          new THREE.TextureLoader();


        const textura =
          await new Promise(
            (resolve, reject) => {

              loader.load(

                "./assets/mascara_base.png",

                resolve,

                undefined,

                reject

              );

            }
          );


        /*
         * Configuración correcta del color.
         */

        textura.colorSpace =
          THREE.SRGBColorSpace;


        textura.needsUpdate =
          true;


        /* -----------------------------------------------
           MATERIAL DE MASCARA
        ------------------------------------------------ */

        faceMesh.material =
          new THREE.MeshBasicMaterial({

            map:
              textura,

            transparent:
              true,

            alphaTest:
              0.01,

            side:
              THREE.DoubleSide,

            depthWrite:
              false,

            depthTest:
              true

          });


        /* -----------------------------------------------
           Añadir FaceMesh
        ------------------------------------------------ */

        scene.add(
          faceMesh
        );


        /* -----------------------------------------------
           ANCHOR FACIAL
           
           Landmark 1 se utiliza como referencia
           para colocar los pétalos.
        ------------------------------------------------ */

        faceAnchor =
          mindarThree.addAnchor(1);


        /* -----------------------------------------------
           CREAR PETALOS
        ------------------------------------------------ */

        crearPetalos();


        /* -----------------------------------------------
           INICIAR CAMARA
        ------------------------------------------------ */

        cambiarEstado(
          "Solicitando acceso a la cámara..."
        );


        await mindarThree.start();


        /* -----------------------------------------------
           AR LISTO
        ------------------------------------------------ */

        cambiarEstado(
          "✨ Rostro detectado — abre la boca"
        );


        /*
         * Ocultar estado después de unos segundos.
         */

        setTimeout(
          () => {

            estado.style.opacity =
              "0";

          },
          4000
        );


        /* -----------------------------------------------
           LOOP DE RENDER
        ------------------------------------------------ */

        renderer.setAnimationLoop(

          () => {


            /*
             * Detectar apertura de boca
             */

            detectarBoca();


            /*
             * Animar pétalos
             */

            animarPetalos();


            /*
             * Renderizar
             */

            renderer.render(
              scene,
              camera
            );

          }

        );

      }


      catch (error) {

        mostrarError(
          error
        );

      }

    }


    /* =====================================================
       RESIZE
    ====================================================== */

    window.addEventListener(

      "resize",

      () => {

        if (!renderer) {

          return;

        }


        renderer.setSize(

          window.innerWidth,

          window.innerHeight

        );


        renderer.setPixelRatio(

          Math.min(
            window.devicePixelRatio,
            2
          )

        );

      }

    );


    /* =====================================================
       INICIAR EXPERIENCIA
    ====================================================== */

    iniciarAR();


  </script>

</body>

</html>
