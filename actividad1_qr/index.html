<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 1 - Efecto Cayendo</title>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

    <style>
        #instruccion {
            position: absolute; top: 10%; left: 50%; transform: translateX(-50%);
            z-index: 10; background: rgba(0, 0, 0, 0.7); color: #f97316;
            padding: 12px 24px; border-radius: 8px; font-family: sans-serif;
            font-weight: bold; font-size: 16px; text-align: center; pointer-events: none;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">
    
    <div id="instruccion">Apunta a tu rostro para ver el efecto</div>

    <a-scene mindar-face embedded color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <!-- TIMEOUT AÑADIDO: Fuerza el inicio a los 3 segundos si la red es lenta -->
        <a-assets timeout="3000">
            <!-- Asumo que son imágenes PNG. Respeta las minúsculas -->
            <img id="mod1" src="modelo1.png" crossorigin="anonymous">
            <img id="mod2" src="modelo2.png" crossorigin="anonymous">
            <img id="mod3" src="modelo3.png" crossorigin="anonymous">
        </a-assets>

        <a-camera active="false" position="0 0 0"></a-camera>

        <!-- Anclamos el punto de inicio en la frente (anchorIndex: 10) -->
        <a-entity mindar-face-target="anchorIndex: 10">
            
            <!-- Modelo 1: Cae por la izquierda -->
            <a-image src="#mod1" scale="0.3 0.3 0.3" material="transparent: true; alphaTest: 0.1;"
                     animation="property: position; from: -0.4 1 0.1; to: -0.4 -3 0.1; dur: 2500; loop: true; easing: linear;">
            </a-image>

            <!-- Modelo 2: Cae por el centro (empieza más alto y cae más lento) -->
            <a-image src="#mod2" scale="0.3 0.3 0.3" material="transparent: true; alphaTest: 0.1;"
                     animation="property: position; from: 0 1.5 0.2; to: 0 -3.5 0.2; dur: 3200; loop: true; easing: linear;">
            </a-image>

            <!-- Modelo 3: Cae por la derecha (cae más rápido) -->
            <a-image src="#mod3" scale="0.3 0.3 0.3" material="transparent: true; alphaTest: 0.1;"
                     animation="property: position; from: 0.4 1.2 0.15; to: 0.4 -2.8 0.15; dur: 2000; loop: true; easing: linear;">
            </a-image>
            
        </a-entity>
        
    </a-scene>
</body>
</html>
