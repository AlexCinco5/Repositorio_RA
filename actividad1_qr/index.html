<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 1 - Juego AR con Marcador</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        #ui { position: absolute; top: 10px; left: 10px; z-index: 10; color: white; font-family: sans-serif; font-size: 24px; font-weight: bold; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; }
    </style>
    <script>
        let puntos = 0;
        AFRAME.registerComponent('interactivo', {
            init: function () {
                this.el.addEventListener('click', () => {
                    puntos += 10;
                    document.getElementById('puntuacion').innerText = puntos;
                    this.el.setAttribute('visible', 'false');
                    setTimeout(() => { this.el.setAttribute('visible', 'true'); }, 2000);
                });
            }
        });
    </script>
</head>
<body style="margin: 0; overflow: hidden;">
    <div id="ui">Puntos: <span id="puntuacion">0</span></div>

    <a-scene mindar-image="imageTargetSrc: marcador.mind;" color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-assets>
            <a-asset-item id="modelo1" src="modelo1.glb"></a-asset-item>
            <a-asset-item id="modelo2" src="modelo2.glb"></a-asset-item>
            <a-asset-item id="modelo3" src="modelo3.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="objects: .clickable"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model src="#modelo1" class="clickable" interactivo position="-0.5 0 0" scale="0.1 0.1 0.1"></a-gltf-model>
            <a-gltf-model src="#modelo2" class="clickable" interactivo position="0 0.5 0" scale="0.1 0.1 0.1"></a-gltf-model>
            <a-gltf-model src="#modelo3" class="clickable" interactivo position="0.5 0 0" scale="0.1 0.1 0.1"></a-gltf-model>
        </a-entity>
    </a-scene>
</body>
</html>
